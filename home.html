<!-- home.html -->
<style>
    /* Keyframe Animations optimized for smooth hardware rendering */
    @keyframes slideFromLeft {
        0% {
            transform: translateX(-60px);
            opacity: 0;
        }
        100% {
            transform: translateX(0);
            opacity: 1;
        }
    }

    @keyframes fadeIn {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Animation Utility Classes */
    .animate-slide-left {
        opacity: 0;
        animation: slideFromLeft 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity;
    }

    .animate-fade-in {
        opacity: 0;
        animation: fadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
        will-change: transform, opacity;
    }

    /* Modern Ambient Glow Mesh */
    .bg-ambient-mesh {
        background-color: #0B0F19;
        background-image: 
            radial-gradient(at 10% 20%, rgba(225, 77, 77, 0.12) 0px, transparent 50%),
            radial-gradient(at 90% 10%, rgba(212, 175, 55, 0.08) 0px, transparent 50%),
            radial-gradient(at 50% 60%, rgba(147, 51, 234, 0.06) 0px, transparent 50%),
            radial-gradient(at 90% 90%, rgba(225, 77, 77, 0.1) 0px, transparent 50%);
        background-attachment: fixed;
    }
</style>

<section id="home" class="min-h-screen flex flex-col justify-between pt-32 px-6 md:px-12 pb-8 relative font-mono bg-ambient-mesh overflow-hidden">
    
    <!-- Hero content wrapper -->
    <div class="max-w-4xl mx-auto my-auto w-full space-y-8 z-10 relative">
        
        <!-- Animated Intro Block (Slides in from Left) -->
        <div class="animate-slide-left space-y-4">
            <!-- Greeting Tagline -->
            <div class="flex items-center gap-3 text-gray-300 text-base md:text-lg tracking-wider">
                <span>Hi, I am</span>
                <span class="w-10 h-[3px] bg-[#E14D4D] rounded-full"></span>
            </div>
            
            <!-- Large Main Title -->
            <h1 class="text-6xl md:text-8xl font-black italic tracking-tight text-white select-none leading-none">
                Nimesh Vasani
            </h1>
            
            <!-- Role Highlight Badge -->
            <p class="text-xl md:text-2xl font-bold tracking-widest text-[#E14D4D] uppercase pt-2">
                [ Mobile Application Developer ]
            </p>
        </div>
        
        <!-- Animated Subtitle / Bio Paragraph (Fades in smoothly) -->
        <div class="animate-fade-in">
            <p class="text-base md:text-xl text-gray-400 max-w-2xl leading-relaxed tracking-wide font-sans">
                Passionate mobile app developer committed to crafting and enhancing user-centric, high-impact applications for global enterprises. Proficient with Android, iOS, and Flutter.
            </p>
        </div>
    </div>

    <!-- Red Rounded-Pill Scroll Indicator (Disappears on Scroll) -->
    <div class="flex justify-center w-full pb-6 z-10 relative">
        <button id="scroll-to-next-btn" aria-label="Scroll down" class="flex flex-col items-center gap-2 text-gray-400 hover:text-[#E14D4D] transition-all duration-500 focus:outline-none group">
            <div class="w-8 h-14 rounded-full border border-[#E14D4D] flex items-center justify-center p-1 transition duration-300 group-hover:border-red-400">
                <!-- Smooth bouncing arrow -->
                <span class="text-[#E14D4D] font-bold text-lg leading-none animate-bounce mt-1">↓</span>
            </div>
        </button>
    </div>
</section>
