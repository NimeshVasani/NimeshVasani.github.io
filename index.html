<!-- Script File Linking -->
    <script src="script.js"></script>

    <!-- Canvas & Active Scrollspy Terminal Controller Scripts -->
    <script>
        // Scrollspy & Dynamic Header Nav Active State Switching
        document.addEventListener("DOMContentLoaded", () => {
            const sections = document.querySelectorAll("section[id], div[id$='-placeholder']");
            const navLinks = document.querySelectorAll("#desktop-nav .nav-link");

            // 1. Click Handling
            navLinks.forEach(link => {
                link.addEventListener("click", function() {
                    navLinks.forEach(l => l.classList.remove("active"));
                    this.classList.add("active");
                });
            });

            // 2. Scrollspy Observer to highlight tab dynamically on scroll
            const observerOptions = {
                root: null,
                rootMargin: "-20% 0px -70% 0px",
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute("id");
                        // Clean up placeholder suffixes if needed
                        const cleanId = id.replace("-placeholder", "");
                        
                        navLinks.forEach(link => {
                            const targetAttr = link.getAttribute("href");
                            if (targetAttr === `#${cleanId}` || targetAttr === `index.html#${cleanId}`) {
                                navLinks.forEach(l => l.classList.remove("active"));
                                link.classList.add("active");
                            }
                        });
                    }
                });
            }, observerOptions);

            sections.forEach(section => observer.observe(section));

            // Terminal Logic
            const inputField = document.getElementById("terminal-input");
            const terminalBody = document.getElementById("terminal-body");

            if (inputField && terminalBody) {
                inputField.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        const cmd = inputField.value.trim().toLowerCase();
                        if (!cmd) return;

                        const userLine = document.createElement("div");
                        userLine.className = "flex items-center gap-1.5 text-gray-300";
                        userLine.innerHTML = `<span class="text-[#E14D4D]">❯</span> <span class="text-white">${escapeHtml(inputField.value)}</span>`;
                        terminalBody.appendChild(userLine);

                        const responseDiv = document.createElement("div");
                        responseDiv.className = "text-gray-400 pl-3 border-l border-gray-800 my-1 text-[11px]";

                        switch(cmd) {
                            case 'help':
                                responseDiv.innerHTML = `Available commands: <br><span class="text-yellow-400">skills</span>, <span class="text-yellow-400">projects</span>, <span class="text-yellow-400">location</span>, <span class="text-yellow-400">hire</span>, <span class="text-yellow-400">clear</span>`;
                                break;
                            case 'skills':
                                responseDiv.innerHTML = `• Mobile: Android (Kotlin/Java), KMP, iOS, Flutter, React Native<br>• Backend: Spring Boot, Node.js, Django`;
                                break;
                            case 'projects':
                                responseDiv.innerHTML = `<span class="text-emerald-400">-> Navigating to projects section...</span>`;
                                window.location.hash = "#projects";
                                break;
                            case 'location':
                                responseDiv.innerHTML = `Based in Canada 🇨🇦 | Open for global collaborations.`;
                                break;
                            case 'hire':
                                responseDiv.innerHTML = `<span class="text-emerald-400">-> Redirecting to contact info...</span>`;
                                window.location.hash = "#extra";
                                break;
                            case 'clear':
                                terminalBody.innerHTML = `<p class="text-emerald-400 terminal-glow">✓ Terminal wiped. Type 'help' for commands.</p>`;
                                inputField.value = "";
                                terminalBody.scrollTop = 0;
                                return;
                            default:
                                responseDiv.innerHTML = `<span class="text-red-400">zsh: command not found: ${escapeHtml(cmd)}. Type 'help'.</span>`;
                        }

                        terminalBody.appendChild(responseDiv);
                        inputField.value = "";
                        terminalBody.scrollTop = terminalBody.scrollHeight;
                    }
                });
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function toggleTerminalMinimize() {
            const contentWrap = document.getElementById("terminal-content-wrap");
            contentWrap.classList.toggle("hidden");
        }

        // Falling Stars & Full-Screen Canvas Animation
        (function() {
            const canvas = document.getElementById('hero-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width, height;
            let stars = [];
            let shootingStars = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener('resize', resize);
            resize();

            class Star {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 0.3;
                    this.vy = (Math.random() - 0.5) * 0.3;
                    this.size = Math.random() * 1.5 + 0.5;
                    this.alpha = Math.random() * 0.7 + 0.3;
                    this.alphaChange = (Math.random() * 0.02) + 0.005;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;

                    this.alpha += this.alphaChange;
                    if (this.alpha > 1 || this.alpha < 0.2) {
                        this.alphaChange *= -1;
                    }
                }

                draw() {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            class ShootingStar {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = 0;
                    this.len = Math.random() * 90 + 50;
                    this.speed = Math.random() * 7 + 5;
                    this.angle = Math.PI / 4;
                    this.opacity = Math.random() * 0.8 + 0.2;
                }

                update() {
                    this.x += this.speed * Math.cos(this.angle);
                    this.y += this.speed * Math.sin(this.angle);

                    if (this.x > width || this.y > height) {
                        this.reset();
                    }
                }

                draw() {
                    ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x - this.len * Math.cos(this.angle), this.y - this.len * Math.sin(this.angle));
                    ctx.stroke();
                }
            }

            const starCount = Math.min(Math.floor((width * height) / 10000), 90);
            for (let i = 0; i < starCount; i++) {
                stars.push(new Star());
            }

            for (let i = 0; i < 4; i++) {
                shootingStars.push(new ShootingStar());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < stars.length; i++) {
                    stars[i].update();
                    stars[i].draw();

                    for (let j = i + 1; j < stars.length; j++) {
                        const dx = stars[i].x - stars[j].x;
                        const dy = stars[i].y - stars[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 90) {
                            ctx.strokeStyle = `rgba(225, 77, 77, ${0.08 * (1 - dist / 90)})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(stars[i].x, stars[i].y);
                            ctx.lineTo(stars[j].x, stars[j].y);
                            ctx.stroke();
                        }
                    }
                }

                for (let i = 0; i < shootingStars.length; i++) {
                    shootingStars[i].update();
                    shootingStars[i].draw();
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
